name: lockfile-recompile
description: >-
  Regenerate every uv lockfile in the calling repo from the command recorded in each
  lock's own header, then open or update a pull request if anything changed. Runs
  entirely on the caller's repo-scoped token: blast radius is one repository.

# WHY THIS IS A COMPOSITE ACTION IN A CENTRAL REPO
#   Fourteen repos used to carry byte-identical copies of this logic, which created a
#   second drift problem: automation was needed to keep the automation identical. One
#   SHA-pinned implementation replaces that. Callers pin this action to a commit SHA;
#   Dependabot bumps the SHA per repo as a normal workflow-file PR, so logic changes
#   still land through per-repo review, never silently.
#
# WHY uv-version IS A REQUIRED INPUT WITH NO DEFAULT
#   The loop and the caller repo's CI drift check must resolve with the SAME uv, or a
#   lock can go "stale" with no code change purely because uv released. That pin is a
#   per-repo fact that must move together with the repo's own ci.yml. A default here
#   would let a central SHA bump silently migrate every repo's resolver at once, which
#   is exactly the failure the pin exists to prevent.

inputs:
  uv-version:
    description: >-
      Exact uv version to install (e.g. "0.12.5"). REQUIRED, no default: bump it
      together with the same pin in this repo's ci.yml, never one without the other.
    required: true
  github-token:
    description: >-
      Token used to push the branch and open the PR. Pass secrets.GITHUB_TOKEN; the
      caller must grant contents:write and pull-requests:write.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv (pinned by the caller; bump together with the repo's ci.yml)
      shell: bash
      run: pip install "uv==${{ inputs.uv-version }}"

    - name: Recompile every lock from the command in its own header
      id: recompile
      shell: bash
      run: |
        set -euo pipefail
        bash "${GITHUB_ACTION_PATH}/recompile-locks.sh" | tee -a "$GITHUB_OUTPUT"
        echo "uv_version=$(uv --version 2>&1 | head -1)" >> "$GITHUB_OUTPUT"

    - name: Open or update the pull request
      if: steps.recompile.outputs.changed != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CHANGED: ${{ steps.recompile.outputs.changed }}
        SKIPPED: ${{ steps.recompile.outputs.skipped }}
        UV_VERSION: ${{ steps.recompile.outputs.uv_version }}
        DELTAS: ${{ steps.recompile.outputs.deltas }}
      run: |
        set -euo pipefail
        branch="lockfile-recompile"
        # Computed live rather than taken from the event payload: schedule events carry
        # no repository object on some triggers, and the caller should not have to pass
        # its own default branch as an input.
        default_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)"

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # THE 2026-08-29 WEDGE. actions/checkout fetches the default branch only, so
        # refs/remotes/origin/lockfile-recompile does not exist locally. A bare
        # --force-with-lease leases against that missing ref, and git refuses a push to
        # a branch that DOES exist on the remote with:
        #
        #   ! [rejected] lockfile-recompile -> lockfile-recompile (stale info)
        #
        # which is fatal and permanent rather than transient, because the branch outlives
        # the merge of its own PR (delete-branch-on-merge is off across the fleet) and
        # every later run hits the identical wall. Measured: the 2026-08-28 weekly fire
        # failed here in 10 of 13 caller repos, and the ref was present in 11 of 11
        # repos checked. The loop was not slow or quiet, it was dead, and it had been
        # reporting nothing at all because no tier watches scheduled runs on main.
        #
        # Fetch the branch so the lease has something real to lease against, then pass
        # that SHA explicitly. Be precise about what this now guarantees: the lease
        # window is the few seconds between this fetch and the push below, so it stops a
        # genuine concurrent run and nothing more. It deliberately does NOT preserve
        # hand-pushed commits on the branch; this loop regenerates from the default
        # branch with --upgrade every time, so the lock it force-pushes is always
        # equal-or-newer than whatever it replaces.
        git fetch --no-tags --depth=1 origin \
          "+refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null || true
        lease="$(git rev-parse --verify --quiet "refs/remotes/origin/${branch}" || true)"

        git checkout -B "$branch"
        # Explicit paths, never `git add -A`: this step must be incapable of committing
        # anything the recompile step did not itself produce.
        git add -- $CHANGED

        count="$(echo "$CHANGED" | wc -w | tr -d ' ')"
        git commit -m "deps: recompile ${count} lockfile(s) against requirements.in" \
                   -m "Dependabot edits requirements.in but cannot regenerate the hash-pinned
        lock the image installs from, so the two drift apart and the drift check
        turns red with nothing to fix it. Regenerated with the command recorded
        in each lock's own header.

        uv: ${UV_VERSION}"

        # Explicit lease, never a bare --force-with-lease (see the wedge note above) and
        # never a plain --force. When the branch is absent from the remote there is
        # nothing to lease against and an ordinary push is the correct create.
        if [ -n "$lease" ]; then
          git push --force-with-lease="${branch}:${lease}" origin "$branch"
        else
          git push origin "$branch"
        fi

        # %0A is how the script encodes newlines through GITHUB_OUTPUT, which is
        # single-line. Decoded here so the PR body reads as a list.
        delta_md="$(printf '%s' "$DELTAS" | sed 's/%0A/\n/g' | sed 's/^/- /')"

        body="Regenerated by \`lockfile-recompile\` using the command recorded in each lock's own header.

        **Files:** ${CHANGED}
        **uv:** \`${UV_VERSION}\`

        **What moved:**
        ${delta_md}

        A large bump count is a dependency UPGRADE, not a lock sync, and deserves a real
        review. Some repos in this fleet only check that the \`==\` pins in
        \`requirements.in\` match the lock, so transitive packages can move a long way with
        CI still green.

        Each lock was compiled to a fresh path (not onto itself, which would read the old
        lock as preferences and keep stale pins), compiled a second time, and required to
        match before this PR was opened.

        If the drift check still fails here, the cause is a uv version difference between
        this run and the CI run, and the version above is the first thing to compare."
        if [ -n "${SKIPPED}" ]; then
          body="${body}

        **Skipped, no uv header:** ${SKIPPED}"
        fi

        # MUST filter on state=open. `gh pr view <branch>` matches a CLOSED pr too, so once
        # anyone closes this PR without merging it, the job would take the edit path
        # forever: it would update a closed PR's body, never open a new one, and exit 0.
        open_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
        if [ -n "$open_pr" ]; then
          gh pr edit "$open_pr" --body "$body"
          exit 0
        fi

        # The one failure this job cannot fix for itself, caught and explained rather than
        # left as a raw GraphQL error at the end of an otherwise successful run.
        #
        # `GITHUB_TOKEN` cannot open a pull request unless the repository allows it, and
        # that setting is OFF by default. Everything above still succeeds: the lock is
        # recompiled, committed and pushed. Only the PR fails.
        if ! gh pr create --base "$default_branch" --head "$branch" \
               --title "deps: recompile lockfiles against requirements.in" \
               --body "$body" 2> /tmp/pr-err; then
          cat /tmp/pr-err
          if grep -q "not permitted to create or approve pull requests" /tmp/pr-err; then
            echo "::error::This repo does not allow Actions to open pull requests, so the"
            echo "::error::recompiled lock is pushed to '$branch' but no PR was opened."
            echo "::error::Fix (repo admin, once per repo):"
            echo "::error::  Settings > Actions > General > Workflow permissions >"
            echo "::error::  tick 'Allow GitHub Actions to create and approve pull requests'"
            echo "::error::or: gh api -X PUT repos/${GITHUB_REPOSITORY}/actions/permissions/workflow \\"
            echo "::error::      -F default_workflow_permissions=read -F can_approve_pull_request_reviews=true"
            echo "::error::The branch is pushed and a PR can be opened by hand meanwhile."
          fi
          exit 1
        fi
