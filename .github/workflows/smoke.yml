name: smoke

# PERMANENT POSITIVE CONTROL for the lockfile-recompile action.
#
# smoke/requirements.lock is DELIBERATELY stale (six pinned below latest). Dispatching
# this workflow must therefore always produce a change and open (or update) a PR on the
# `lockfile-recompile` branch. A run that ends green with no PR means the action has
# regressed into a silent no-op, which is exactly the failure mode a harness with no
# positive control cannot see. Close the PR after reading it; never merge it, or the
# control stops being a control.
#
# `uses: ./lockfile-recompile` tests HEAD of this repo, so run this BEFORE tagging a
# release, and pin callers only to tags whose smoke passed.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lockfile-recompile
  cancel-in-progress: false

jobs:
  # BOTH DIRECTIONS, in one job, against the same stale fixture:
  #   1. the drift check MUST FAIL on the stale lock (a check that cannot say no is not
  #      a check), and
  #   2. after fixing the lock in the working tree, the SAME check MUST PASS (a check
  #      that cannot say yes is not a check either; a redaction pass that matches
  #      nothing looks exactly like a clean one).
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Drift check against the stale control lock (must fail)
        id: must_fail
        continue-on-error: true
        uses: ./lockfile-drift
        with:
          uv-version: '0.12.5'
      - name: Require the failure
        if: steps.must_fail.outcome != 'failure'
        run: |
          echo "::error::drift check passed on a deliberately stale lock: it can never say no"
          exit 1
      - name: Fix the lock in the working tree (no commit)
        run: bash ./lockfile-recompile/recompile-locks.sh
      - name: Drift check against the fixed lock (must pass)
        uses: ./lockfile-drift
        with:
          uv-version: '0.12.5'

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./lockfile-recompile
        with:
          uv-version: '0.12.5'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require the PR that proves the action did something
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --head lockfile-recompile --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "::error::smoke ran green but opened no PR: the action is a silent no-op"
            exit 1
          fi
          echo "positive control satisfied: PR #$pr is open"

  # REGRESSION CONTROL for the 2026-08-29 wedge, and the reason this workflow now has
  # three jobs instead of two.
  #
  # The `smoke` job above only ever proved the action works against a remote where the
  # `lockfile-recompile` branch does NOT already exist. That is the first run in a repo
  # and no other. From the second run onward the branch is always there, because closing
  # or merging its PR leaves the ref behind, and a bare --force-with-lease against a
  # branch with no local tracking ref is refused as "(stale info)". So the action was
  # broken in every caller repo from its second scheduled fire, and the harness could
  # not see it: the control was testing the one case that never recurs.
  #
  # This job reproduces the recurring case. It fails on the pre-fix action.
  rerun-over-an-existing-branch:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Plant the branch on the remote, as a merged-and-undeleted PR leaves it
        # Planted through the API, deliberately, NOT with `git push`. A push also writes
        # refs/remotes/origin/lockfile-recompile into this checkout, which is the exact
        # thing whose absence causes the bug, so planting by push makes the bare lease
        # resolve and the job goes green against the broken action. That is not a
        # hypothetical: it is what the first version of this control did, and the
        # precondition assertion below is what caught it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/lockfile-recompile" \
              -f sha="$sha" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                 -f ref=refs/heads/lockfile-recompile -f sha="$sha" >/dev/null
          # Recorded NOW. The action checks out the branch and commits on it, so by the
          # time the assertion step runs, HEAD is the action's own new commit and no
          # longer the planted one. Reading it late made the assertion compare a value
          # against itself and fail on a working action.
          echo "planted_sha=$sha" >> "$GITHUB_ENV"
          echo "planted lockfile-recompile at $sha via the API"

      - name: Confirm the wedge conditions actually hold
        # A control on the control. If actions/checkout ever starts fetching every ref,
        # the tracking ref would exist, the bare lease would resolve, and this job would
        # go green while testing nothing at all. That is the precise shape of a guard
        # that looks present and does nothing, so assert the precondition rather than
        # assuming it.
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads origin lockfile-recompile >/dev/null \
            || { echo "::error::planted branch is not on the remote; control is broken"; exit 1; }
          if git rev-parse --verify --quiet refs/remotes/origin/lockfile-recompile >/dev/null; then
            echo "::error::a local tracking ref exists, so this job no longer reproduces the wedge"
            exit 1
          fi
          echo "OK: remote branch present, local tracking ref absent. This is the failing case."

      - uses: ./lockfile-recompile
        with:
          uv-version: '0.12.5'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the push to have survived an already-existing branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/lockfile-recompile | cut -f1)"
          if [ "$remote" = "$planted_sha" ]; then
            echo "::error::branch still points at the planted commit ${planted_sha}:"
            echo "::error::the action did not push over the pre-existing branch."
            exit 1
          fi
          pr="$(gh pr list --head lockfile-recompile --state open --json number --jq '.[0].number // empty')"
          [ -n "$pr" ] || { echo "::error::no PR after rerun over an existing branch"; exit 1; }
          echo "regression control satisfied: branch advanced to ${remote}, PR #$pr open"
