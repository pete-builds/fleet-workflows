name: smoke

# PERMANENT POSITIVE CONTROL for the lockfile-recompile action.
#
# smoke/requirements.lock is DELIBERATELY stale (six pinned below latest). Dispatching
# this workflow must therefore always produce a change and open (or update) a PR on the
# `lockfile-recompile` branch. A run that ends green with no PR means the action has
# regressed into a silent no-op, which is exactly the failure mode a harness with no
# positive control cannot see. Close the PR after reading it; never merge it, or the
# control stops being a control.
#
# `uses: ./lockfile-recompile` tests HEAD of this repo, so run this BEFORE tagging a
# release, and pin callers only to tags whose smoke passed.
#
# `smoke` and `rerun-over-an-existing-branch` push a branch and open a real PR, so they run
# on manual dispatch ONLY. `drift-check` and the assertion-guard controls write nothing
# and run on every push and pull request.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

# Dispatch runs keep the one shared group they always had (they push the
# lockfile-recompile branch). Push and PR runs only read, so each ref gets its own group
# and never queues behind, or cancels, a dispatch.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'lockfile-recompile' || format('smoke-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # PERMANENT CONTROLS for assertion-guard, both directions, on every change:
  #   unit tests (each rule caught AND its legitimate neighbour left alone), then the two
  #   fixtures: weakened.diff must fail with exactly weakened.expected, and
  #   clean-refactor.diff (rename, move, added assertions, reformatting) must pass.
  assertion-guard-controls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -B assertion-guard/test_guard.py
      - name: Fixtures (weakened must fail exactly, clean refactor must pass)
        run: bash smoke/assertion-guard/check.sh
      # The collection diff against the REAL runners, pinned: pytest 9.2.0 from a
      # hash-checked lock, vitest 3.2.4 from its package-lock. A missing runner is a FAIL.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the pinned runners
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/runner-py"
          "$RUNNER_TEMP/runner-py/bin/pip" install -q --require-hashes -r smoke/assertion-guard/runner-py/requirements.lock
          npm ci --prefix smoke/assertion-guard/runner-js --ignore-scripts --no-audit --no-fund
      - name: Collection-diff fixtures (every round-three hole red, judged by the runner)
        env:
          RUNNER_PYTHON: ${{ runner.temp }}/runner-py/bin/python
        run: python3 -B smoke/assertion-guard/runner_cases.py

  # The composite action end to end, in git mode, as a caller runs it. The fixtures above
  # prove the rules; this proves action.yml wires them. Each planted pair must end with
  # exit code 1 AND a test-deleted finding: "any failure" would also accept exit 2, a guard
  # that could not read the diff at all. Then the action must PASS on this pull request.
  assertion-guard-action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Plant commit pairs that each delete a test
        run: |
          set -euo pipefail
          git config user.name ctl
          git config user.email ctl@example.invalid
          echo "ctl_orig=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # Pair 1: one test removed from a file that stays.
          mkdir -p ctl-planted/tests
          printf 'def test_kept():\n    assert keep() == 1\n\n\ndef test_dropped():\n    assert drop() == 2\n' \
            > ctl-planted/tests/test_ctl.py
          git add ctl-planted && git commit -qm "ctl: two tests"
          echo "ctl_base=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'def test_kept():\n    assert keep() == 1\n' > ctl-planted/tests/test_ctl.py
          git commit -qam "ctl: drop one"
          echo "ctl_head=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # Pair 2 (review finding F1): a whole test file named for a feature, not a
          # module, deleted while the code it tests stays. Git mode once excused this.
          mkdir -p ctl-planted/src/app
          printf 'def login(u, p):\n    return u == "a" and p == "b"\n' > ctl-planted/src/app/auth.py
          printf 'def test_rejects_bad_password():\n    assert login("a", "x") is False\n' \
            > ctl-planted/tests/test_security.py
          git add ctl-planted && git commit -qm "ctl: feature-named test file"
          echo "ctl_base2=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rm -q ctl-planted/tests/test_security.py && git commit -qm "ctl: delete it"
          echo "ctl_head2=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: The action on pair 1, a test removed (must fail with exit 1)
        id: pair1
        continue-on-error: true
        uses: ./assertion-guard
        with:
          base: ${{ env.ctl_base }}
          head: ${{ env.ctl_head }}
      - name: The action on pair 2, a feature-named test file deleted (must fail with exit 1)
        id: pair2
        continue-on-error: true
        uses: ./assertion-guard
        with:
          base: ${{ env.ctl_base2 }}
          head: ${{ env.ctl_head2 }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: The action on pair 1 again, with the runner deciding (must fail with exit 1)
        id: pair3
        continue-on-error: true
        uses: ./assertion-guard
        with:
          base: ${{ env.ctl_base }}
          head: ${{ env.ctl_head }}
          collect-setup: python -m pip install -q --require-hashes -r smoke/assertion-guard/runner-py/requirements.lock
          collect-command: python -m pytest --collect-only -q -p no:cacheprovider ctl-planted
      - name: Require exit 1 and test-deleted from all three
        env:
          P3_OUTCOME: ${{ steps.pair3.outcome }}
          P3_EXIT: ${{ steps.pair3.outputs.exit-code }}
          P3_KINDS: ${{ steps.pair3.outputs.kinds }}
          P3_VERDICT: ${{ steps.pair3.outputs.verdict }}
          P1_OUTCOME: ${{ steps.pair1.outcome }}
          P1_EXIT: ${{ steps.pair1.outputs.exit-code }}
          P1_KINDS: ${{ steps.pair1.outputs.kinds }}
          P2_OUTCOME: ${{ steps.pair2.outcome }}
          P2_EXIT: ${{ steps.pair2.outputs.exit-code }}
          P2_KINDS: ${{ steps.pair2.outputs.kinds }}
        run: |
          set -u
          bad=0
          for p in 1 2 3; do
            outcome_var="P${p}_OUTCOME"; exit_var="P${p}_EXIT"; kinds_var="P${p}_KINDS"
            outcome="${!outcome_var}"; code="${!exit_var}"; kinds="${!kinds_var}"
            if [ "$outcome" != failure ] || [ "$code" != 1 ]; then
              echo "::error::pair $p: outcome '$outcome', exit '$code'; want failure with exit 1"; bad=1
            fi
            case ",$kinds," in
              *,test-deleted,*) ;;
              *) echo "::error::pair $p: findings '$kinds' do not include test-deleted"; bad=1 ;;
            esac
          done
          case "$P3_VERDICT" in
            *"test deletions checked by the runner"*) ;;
            *) echo "::error::pair 3 verdict does not say the runner decided: $P3_VERDICT"; bad=1 ;;
          esac
          if [ "$bad" -ne 0 ]; then echo "assertion-guard action controls: FAIL"; exit 1; fi
          echo "assertion-guard action controls: PASS (pair 1 exit $P1_EXIT [$P1_KINDS], pair 2 exit $P2_EXIT [$P2_KINDS], pair 3 by the runner exit $P3_EXIT [$P3_KINDS])"
      - name: Back to the checkout this run started from
        run: git checkout -q "$ctl_orig"
      - name: The action on this pull request, the runner deciding deletions (must pass unless the PR weakens a test)
        uses: ./assertion-guard
        with:
          collect-command: python -m pytest --collect-only -q -p no:cacheprovider

  # BOTH DIRECTIONS, in one job, against the same stale fixture:
  #   1. the drift check MUST FAIL on the stale lock (a check that cannot say no is not
  #      a check), and
  #   2. after fixing the lock in the working tree, the SAME check MUST PASS (a check
  #      that cannot say yes is not a check either; a redaction pass that matches
  #      nothing looks exactly like a clean one).
  #
  # Read only (it opens nothing and pushes nothing), so it runs on every push and PR.
  drift-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Drift check against the stale control lock (must fail)
        id: must_fail
        continue-on-error: true
        uses: ./lockfile-drift
        with:
          uv-version: '0.12.5'
      - name: Require the failure
        if: steps.must_fail.outcome != 'failure'
        run: |
          echo "::error::drift check passed on a deliberately stale lock: it can never say no"
          exit 1
      - name: Fix the lock in the working tree (no commit)
        run: bash ./lockfile-recompile/recompile-locks.sh
      - name: Drift check against the fixed lock (must pass)
        uses: ./lockfile-drift
        with:
          uv-version: '0.12.5'

  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./lockfile-recompile
        env:
          # The REAL halt switch on main still applies (FLEET_HALT_URL is left alone), so
          # Pete's HALT stops this smoke too. Only the ALIVE marker is read at this commit,
          # so a dispatch on a branch works before halt-check/ALIVE reaches main.
          FLEET_HALT_ALIVE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/halt-check/ALIVE
        with:
          uv-version: '0.12.5'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require the PR that proves the action did something
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --head lockfile-recompile --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "::error::smoke ran green but opened no PR: the action is a silent no-op"
            exit 1
          fi
          echo "positive control satisfied: PR #$pr is open"

  # REGRESSION CONTROL for the 2026-08-29 wedge, and the reason this workflow now has
  # three jobs instead of two.
  #
  # The `smoke` job above only ever proved the action works against a remote where the
  # `lockfile-recompile` branch does NOT already exist. That is the first run in a repo
  # and no other. From the second run onward the branch is always there, because closing
  # or merging its PR leaves the ref behind, and a bare --force-with-lease against a
  # branch with no local tracking ref is refused as "(stale info)". So the action was
  # broken in every caller repo from its second scheduled fire, and the harness could
  # not see it: the control was testing the one case that never recurs.
  #
  # This job reproduces the recurring case. It fails on the pre-fix action.
  rerun-over-an-existing-branch:
    if: github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Plant the branch on the remote, as a merged-and-undeleted PR leaves it
        # Planted through the API, deliberately, NOT with `git push`. A push also writes
        # refs/remotes/origin/lockfile-recompile into this checkout, which is the exact
        # thing whose absence causes the bug, so planting by push makes the bare lease
        # resolve and the job goes green against the broken action. That is not a
        # hypothetical: it is what the first version of this control did, and the
        # precondition assertion below is what caught it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/lockfile-recompile" \
              -f sha="$sha" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                 -f ref=refs/heads/lockfile-recompile -f sha="$sha" >/dev/null
          # Recorded NOW. The action checks out the branch and commits on it, so by the
          # time the assertion step runs, HEAD is the action's own new commit and no
          # longer the planted one. Reading it late made the assertion compare a value
          # against itself and fail on a working action.
          echo "planted_sha=$sha" >> "$GITHUB_ENV"
          echo "planted lockfile-recompile at $sha via the API"

      - name: Confirm the wedge conditions actually hold
        # A control on the control. If actions/checkout ever starts fetching every ref,
        # the tracking ref would exist, the bare lease would resolve, and this job would
        # go green while testing nothing at all. That is the precise shape of a guard
        # that looks present and does nothing, so assert the precondition rather than
        # assuming it.
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads origin lockfile-recompile >/dev/null \
            || { echo "::error::planted branch is not on the remote; control is broken"; exit 1; }
          if git rev-parse --verify --quiet refs/remotes/origin/lockfile-recompile >/dev/null; then
            echo "::error::a local tracking ref exists, so this job no longer reproduces the wedge"
            exit 1
          fi
          echo "OK: remote branch present, local tracking ref absent. This is the failing case."

      - uses: ./lockfile-recompile
        env:
          # The REAL halt switch on main still applies (FLEET_HALT_URL is left alone), so
          # Pete's HALT stops this smoke too. Only the ALIVE marker is read at this commit,
          # so a dispatch on a branch works before halt-check/ALIVE reaches main.
          FLEET_HALT_ALIVE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/halt-check/ALIVE
        with:
          uv-version: '0.12.5'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the push to have survived an already-existing branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/lockfile-recompile | cut -f1)"
          if [ "$remote" = "$planted_sha" ]; then
            echo "::error::branch still points at the planted commit ${planted_sha}:"
            echo "::error::the action did not push over the pre-existing branch."
            exit 1
          fi
          pr="$(gh pr list --head lockfile-recompile --state open --json number --jq '.[0].number // empty')"
          [ -n "$pr" ] || { echo "::error::no PR after rerun over an existing branch"; exit 1; }
          echo "regression control satisfied: branch advanced to ${remote}, PR #$pr open"
